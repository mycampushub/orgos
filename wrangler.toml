# OrgOS — Cloudflare Workers deployment configuration (canonical)
# -------------------------------------------------------------------------

name = "orgos"
main = ".open-next/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# OpenNext serves the built Next.js assets through this binding
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---- D1: the relational database (same schema as prisma/schema.prisma) ----
# Binding name must match cloudflare/env.d.ts (DATABASE) and cloudflare/snippets/db-d1.ts
[[d1_databases]]
binding = "DATABASE"
database_name = "orgos"
database_id = "d43ee46b-7e16-47ea-b59d-fbee1e1e41c8"
migrations_dir = "cloudflare/migrations"
migrations_table = "__cf_d1_migrations"

# ---- R2: object storage for Documents / attachments (Document.storageKey) ----
# Binding name must match cloudflare/env.d.ts (BUCKET) and src/lib/server/storage.ts
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "orgos-documents"

# ---- KV: hot caches + session/token lookups ----
[[kv_namespaces]]
binding = "SESSIONS"
id = "7c18fe61fa1a4d7c871fe9b510cf60d8"

[[kv_namespaces]]
binding = "CACHE"
id = "d51a90715c194032858b35ea780f4bd6"

# ---- Environment ----
# CF_WORKER=1 makes src/lib/server/storage.ts route put/get/delete through
# the BUCKET R2 binding instead of the local disk (db/uploads).
[vars]
APP_ENV = "production"
DEFAULT_CURRENCY = "BDT"
DEFAULT_TIMEZONE = "Asia/Dhaka"
CF_WORKER = "1"

# Secrets (never commit — set with `wrangler secret put`):
#   wrangler secret put APP_SECRET   # session signing pepper

[observability]
enabled = true

# Optional: scheduled jobs (invoice overdue sweep, leave reminders)
# Uncomment after implementing the scheduled handler in the worker entry.
# [triggers]
# crons = ["0 1 * * *"]              # 01:00 UTC daily
